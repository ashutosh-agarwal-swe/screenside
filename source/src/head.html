<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenside PDF Tools</title>
<meta name="referrer" content="no-referrer">
<!--CSP-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Caveat:wght@500&family=Dancing+Script:wght@500&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a light table. One fixed header, then a single view at a time: tool shelf, tool bench, page desk or page editor. */
:root {
  /* Palette: dark blue, gold, signal red, silver, army green. */
  --desk: #e9ebef; --panel: #ffffff; --ink: #101b3f; --muted: #5a6274; --line: #c7ccd6;
  --accent: #16296b; --accent-ink: #ffffff; --accent-soft: #dfe4f4; --danger: #c8102e; --good: #4b5320; --gold: #c79a1b; --navy: #0f1b45; --paper: #ffffff;
  --c-org: #16296b; --c-conv: #94700a; --c-edit: #4b5320; --c-sec: #c8102e;
  --sheet-shadow: 0 1px 2px rgba(16,27,63,.18), 0 6px 16px rgba(16,27,63,.10);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --thumb: 160px;
  --gap: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --desk: #0a1024; --panel: #131b36; --ink: #e9ecf3; --muted: #a9b0c0; --line: #283256;
    --accent: #e0b83c; --accent-ink: #0a1024; --accent-soft: #2a2f4d; --danger: #ff5c72; --good: #a9b56b; --gold: #e0b83c; --navy: #0c1432; --paper: #f4f5f8;
    --c-org: #8ea2ff; --c-conv: #e0b83c; --c-edit: #a9b56b; --c-sec: #ff5c72;
    --sheet-shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --desk: #0a1024; --panel: #131b36; --ink: #e9ecf3; --muted: #a9b0c0; --line: #283256;
  --accent: #e0b83c; --accent-ink: #0a1024; --accent-soft: #2a2f4d; --danger: #ff5c72; --good: #a9b56b; --gold: #e0b83c; --navy: #0c1432; --paper: #f4f5f8;
  --c-org: #8ea2ff; --c-conv: #e0b83c; --c-edit: #a9b56b; --c-sec: #ff5c72;
  --sheet-shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--desk); color: var(--ink); font: 400 14px/1.45 var(--font-body); display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
[hidden] { display: none !important; }

.top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--navy); border-bottom: 3px solid var(--gold); color: #fff; }
.top .btn { color: #fff; border-color: rgba(255,255,255,.4); }
.top .btn:hover { background: rgba(255,255,255,.14); border-color: #fff; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; text-decoration: none; color: #fff; }
.brand b { font: 700 24px/1 var(--font-display); letter-spacing: -.02em; }
.top .tagline { color: #c3c8d4; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { flex: 1; min-height: 0; display: none; flex-direction: column; }
.view.on { display: flex; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }

.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; background: transparent; border: 1px solid var(--line); border-radius: 8px; white-space: nowrap; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.icon { width: 36px; padding: 0; justify-content: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 0 16px; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
.btn.danger:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.big { height: 46px; padding: 0 22px; font-size: 16px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Home */
.home { max-width: 1120px; margin: 0 auto; padding: 28px 20px 48px; display: flex; flex-direction: column; gap: 26px; }
.hero { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.hero h1 { font: 700 34px/1.05 var(--font-display); letter-spacing: -.025em; margin: 0 0 6px; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 62ch; }
.search { height: 40px; width: min(300px, 100%); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--panel); }
.cat h2 { font: 700 13px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.cat h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tcard { display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); min-height: 72px; }
.tcard:hover { border-color: var(--c); box-shadow: 0 2px 10px rgba(20,26,46,.08); }
.tcard .ti { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); flex: none; }
.tcard b { display: block; font-weight: 600; }
.tcard small { color: var(--muted); font-size: 12.5px; line-height: 1.35; display: block; }
.missing { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
.missing b { color: var(--ink); }
.foot { border-top: 3px solid var(--gold); padding-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 28px; font-size: 13.5px; color: var(--muted); }
.foot > div h3 { text-align: center; }
.foot > div p { text-align: left; }
.foot h3 { margin: 0 0 4px; font: 700 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.foot p { margin: 0; }
.foot a { font-weight: 600; }
.foot .legal { grid-column: 1 / -1; font-size: 12.5px; }
.shield { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--good); border-radius: 10px; padding: 12px 14px; }
.shield svg { color: var(--good); width: 22px; height: 22px; margin-top: 1px; }
.shield b { display: block; }
.shield span { color: var(--muted); font-size: 13.5px; }

/* Tool bench */
.bench { max-width: 820px; width: 100%; margin: 0 auto; padding: 22px 20px 48px; display: flex; flex-direction: column; gap: 16px; }
.crumb { color: var(--muted); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.crumb:hover { color: var(--accent); }
.thead h1 { font: 700 30px/1.1 var(--font-display); letter-spacing: -.02em; margin: 6px 0 4px; }
.thead p { margin: 0; color: var(--muted); max-width: 70ch; }
.thead .note { margin-top: 8px; font-size: 13px; border-left: 3px solid var(--c, var(--accent)); padding: 2px 0 2px 10px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 44px 20px; text-align: center; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.drop.over, body.tooldrag .drop { border-color: var(--accent); background: var(--accent-soft); }
.drop small { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel > h3 { margin: 0; font: 700 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.frow { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 0; border-top: 1px solid var(--line); }
.frow:first-of-type { border-top: 0; }
.frow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.frow .mt { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.frow .er { color: var(--danger); font-size: 12.5px; }
.frow button.x { width: 28px; height: 28px; border: 0; background: none; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
.frow button.x:hover { background: var(--accent-soft); color: var(--accent); }
.frow button.x svg { width: 15px; height: 15px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field > span.l { font-weight: 500; font-size: 13px; }
.field small { color: var(--muted); font-size: 12px; }
.field input[type=text], .field input[type=number], .field input[type=password], .field select, .field textarea { height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--desk); width: 100%; }
.field textarea { height: auto; min-height: 70px; padding: 8px 10px; resize: vertical; }
.field input[type=range] { accent-color: var(--accent); width: 100%; }
.field .ck { display: flex; gap: 8px; align-items: center; font-weight: 400; }
.field .ck input { accent-color: var(--accent); width: 16px; height: 16px; }
.runrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.status { color: var(--muted); font-size: 13px; }
.status.err { color: var(--danger); }
.res .frow .nm { font-weight: 600; }
.res select { height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--desk); padding: 0 6px; max-width: 150px; }
.res .ok { color: var(--good); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.res .ok.warn { color: var(--danger); }
.pairs { display: flex; flex-wrap: wrap; gap: 10px; }
.pair { display: flex; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--desk); }
.pcell { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); width: 70px; text-align: center; }
.pcell b { font: 500 12px var(--font-mono); color: var(--ink); }
.pcell.solo small { color: var(--danger); font-weight: 600; }
.pthumb { width: 64px; height: 84px; display: grid; place-items: center; background: var(--paper); box-shadow: var(--sheet-shadow); border-radius: 2px; overflow: hidden; }
.pthumb img { max-width: 100%; max-height: 100%; display: block; }
.chk { border-top: 1px solid var(--line); padding: 10px 0 2px; }
.chk:first-child { border-top: 0; padding-top: 0; }
.chk h4 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chk p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.chk ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; overflow-wrap: anywhere; }
.pill { font: 500 11px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border-radius: 10px; white-space: nowrap; }
.pill.found { background: color-mix(in srgb, var(--gold) 28%, transparent); color: var(--ink); }
.pill.none { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.pill.error { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.textout { white-space: pre-wrap; background: var(--desk); border-radius: 8px; padding: 12px; max-height: 420px; overflow: auto; font-size: 14px; line-height: 1.5; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.chat .log { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding: 2px; }
.chat .msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; }
.chat .msg.u { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.chat .msg.a { align-self: flex-start; background: var(--desk); border-bottom-left-radius: 4px; }
.chat form { display: flex; gap: 8px; }
.chat form input { flex: 1; height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--desk); min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: none; border-radius: 16px; padding: 4px 10px; font-size: 13px; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }

/* Organizer */
.bar-wrap { background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 20px; min-width: max-content; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.count b { color: var(--ink); font-weight: 600; }
.zoom { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-left: auto; padding-left: 12px; }
.zoom input { width: 110px; accent-color: var(--accent); }
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 20px 0; flex: none; }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 7px 8px 7px 12px; max-width: 100%; }
.banner .tag { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.banner button { height: 28px; }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; max-width: 260px; }
.chip span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.desk { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 28px 40px; position: relative; }
.grid { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: flex-start; user-select: none; -webkit-user-select: none; }
.card { position: relative; width: calc(var(--thumb) + 16px); padding: 8px; border-radius: 10px; border: 2px solid transparent; touch-action: pan-y; -webkit-touch-callout: none; cursor: grab; }
.card:hover { background: color-mix(in srgb, var(--panel) 60%, transparent); }
.card.sel { background: var(--panel); border-color: var(--accent); }
.card.dragging { opacity: .3; }
.thumb { width: var(--thumb); height: var(--thumb); display: flex; align-items: center; justify-content: center; }
.sheet { position: relative; background: var(--paper); box-shadow: var(--sheet-shadow); overflow: hidden; border-radius: 2px; }
.sheet img { position: absolute; top: 50%; left: 50%; display: block; pointer-events: none; }
.sheet img:not([src]) { visibility: hidden; }
.sheet .blank { position: absolute; inset: 0; display: grid; place-items: center; color: #8a90a4; font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
.pick { position: absolute; top: 12px; left: 12px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); opacity: 0; transform: scale(.6); transition: opacity .12s, transform .12s; pointer-events: none; }
.pick svg { width: 14px; height: 14px; stroke-width: 2.6; }
.card.sel .pick { opacity: 1; transform: none; }
.meta { display: flex; align-items: center; gap: 7px; margin-top: 8px; min-width: 0; }
.num { font: 500 12px/1 var(--font-mono); background: var(--ink); color: var(--desk); border-radius: 4px; padding: 3px 6px; font-variant-numeric: tabular-nums; flex: none; }
.src { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.acts { display: flex; gap: 2px; margin-top: 4px; justify-content: space-between; }
.acts button { flex: 1; height: 28px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 6px; color: var(--muted); }
.acts button svg { width: 16px; height: 16px; }
.acts button:hover { background: var(--accent-soft); color: var(--accent); }
.acts button.del:hover { color: var(--danger); }
.ins { position: absolute; right: calc(var(--gap) / -2 - 14px); top: calc(8px + var(--thumb) / 2 - 12px); width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; padding: 0; z-index: 2; opacity: 0; transition: opacity .12s; }
.ins svg { width: 14px; height: 14px; }
.card:hover .ins, .ins:focus-visible, .ins.open { opacity: 1; }
.ins:hover, .ins.open { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (hover: none) { .ins { opacity: 1; } }
.addtile { width: calc(var(--thumb) + 16px); height: calc(var(--thumb) + 16px); border: 2px dashed var(--line); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); padding: 10px; text-align: center; }
.addtile button { background: none; border: 0; padding: 4px 8px; border-radius: 6px; color: var(--accent); font-weight: 600; }
.addtile button:hover { background: var(--accent-soft); }
.empty { max-width: 520px; margin: 8vh auto 0; text-align: center; border: 2px dashed var(--line); border-radius: 14px; padding: 44px 24px; }
.empty h2 { font: 700 26px/1.15 var(--font-display); letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance; }
.empty p { color: var(--muted); margin: 0 0 20px; }
.hint { padding: 7px 20px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; display: flex; gap: 6px 18px; flex-wrap: wrap; flex: none; }
.hint kbd { font: 500 11px var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.ghost { position: fixed; z-index: 50; pointer-events: none; left: 0; top: 0; width: 90px; }
.ghost .sheet { box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.ghost .badge { position: absolute; top: -10px; right: -10px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 500 12px/24px var(--font-mono); text-align: center; }
.marker { position: fixed; z-index: 40; width: 4px; border-radius: 2px; background: var(--accent); pointer-events: none; display: none; }
.dropveil { position: absolute; inset: 10px; border: 3px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 70%, transparent); display: none; place-items: center; font: 700 22px var(--font-display); color: var(--accent); pointer-events: none; z-index: 30; }
body.filedrag .dropveil.on { display: grid; }

/* Editor */
.ed-bar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.ed-bar > * { flex: none; }
.ed-bar .ttl { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 6px; }
.ed-bar .grow { flex: 1; }
.ed-bar select { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0 6px; }
#edFinish { position: sticky; right: 0; box-shadow: -10px 0 8px var(--panel), 10px 0 0 var(--panel); }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--accent); }
.ed-pages { flex: 1; min-height: 0; overflow: auto; padding: 22px 16px 60px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.pg { position: relative; background: var(--paper); box-shadow: var(--sheet-shadow); flex: none; }
.pg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pg svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; touch-action: none; }
.pg svg.ov.pan { touch-action: auto; }
.pg .pn { position: absolute; left: 0; top: -17px; font: 500 11px var(--font-mono); color: var(--muted); }
.pg textarea.te { position: absolute; z-index: 5; border: 1px dashed var(--accent); background: rgba(255,255,255,.85); color: #000; padding: 0; margin: 0; resize: none; overflow: hidden; line-height: 1.2; font-family: Helvetica, Arial, sans-serif; outline: 0; min-width: 40px; }
.ed-tip { padding: 6px 14px; font-size: 12.5px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); flex: none; }

/* Popover, modal, toast */
.menu { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.2); display: none; min-width: 170px; }
.menu.open { display: block; }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px; background: none; border: 0; border-radius: 6px; text-align: left; }
.menu button:hover { background: var(--accent-soft); }
.veil { position: fixed; inset: 0; z-index: 70; background: rgba(8,10,18,.84); display: none; align-items: center; justify-content: center; padding: 16px; }
.veil.open { display: flex; }
.dialog { background: var(--panel); border-radius: 14px; padding: 22px; width: min(480px, 100%); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.4); max-height: 100%; overflow: auto; }
.dialog h2 { font: 700 22px/1.1 var(--font-display); letter-spacing: -.02em; margin: 0; }
.dialog label.f { display: flex; flex-direction: column; gap: 5px; font-weight: 500; }
.dialog input[type=text] { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--desk); }
.radio { display: flex; flex-direction: column; gap: 6px; }
.radio label { display: flex; gap: 8px; align-items: center; }
.radio input { accent-color: var(--accent); }
.dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 13px; margin: 0; min-height: 1.45em; }
.note.err { color: var(--danger); }
.tabs { display: flex; gap: 6px; }
.sigpad { width: 100%; height: 170px; background: #fff; border: 1px solid var(--line); border-radius: 8px; touch-action: none; display: block; }
.sigfonts { display: flex; gap: 8px; flex-wrap: wrap; }
.sigfonts button { flex: 1; min-width: 120px; height: 56px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #141a2e; font-size: 26px; overflow: hidden; white-space: nowrap; }
.sigfonts button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pv { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 10px; }
.pv-head { display: flex; align-items: center; gap: 8px; color: #fff; }
.pv-head .t { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pv-head .btn { color: #fff; border-color: rgba(255,255,255,.35); }
.pv-head .btn:hover:not(:disabled) { background: rgba(255,255,255,.15); border-color: #fff; }
.pv-stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.pv-stage canvas { background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.toasts { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(520px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--desk); border-radius: 8px; padding: 9px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 100%; }
@media (max-width: 720px) { .foot { grid-template-columns: 1fr; } .foot > div h3 { text-align: left; } .hint { display: none; } .top .tagline { display: none; } .desk { padding: 16px 16px 32px; } :root { --gap: 18px; } .hero h1 { font-size: 28px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#home"><b>Screenside</b></a>
  <span class="tagline">PDF tools that run on your side of the screen</span>
  <a class="btn" id="allTools" href="#home" hidden>All tools</a>
</header>

<section class="view" id="v-home"><div class="scroll"><div class="home" id="home"></div></div></section>

<section class="view" id="v-tool"><div class="scroll"><div class="bench" id="bench"></div></div></section>

<section class="view" id="v-organize">
  <div class="bar-wrap">
    <div class="bar" role="toolbar" aria-label="Page tools">
      <button class="btn" id="addBtn"></button>
      <button class="btn" id="blankBtn"></button>
      <span class="sep"></span>
      <button class="btn" id="selAllBtn">Select all</button>
      <button class="btn icon" id="rotLBtn" title="Rotate selected left" aria-label="Rotate selected left"></button>
      <button class="btn icon" id="rotRBtn" title="Rotate selected right" aria-label="Rotate selected right"></button>
      <button class="btn icon" id="dupBtn" title="Duplicate selected" aria-label="Duplicate selected"></button>
      <button class="btn icon danger" id="delBtn" title="Delete selected" aria-label="Delete selected"></button>
      <span class="sep"></span>
      <button class="btn" id="revBtn" title="Reverse the order of the selected pages, or of all pages when none are selected"></button>
      <span class="count" id="count" aria-live="polite"></span>
      <label class="zoom" for="zoom">Size <input type="range" id="zoom" min="100" max="280" step="10" value="160"></label>
      <span class="sep"></span>
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
      <button class="btn primary" id="finishBtn"></button>
    </div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="desk" id="desk">
    <div class="grid" id="grid" role="listbox" aria-multiselectable="true" aria-label="Pages"></div>
    <div class="dropveil on">Drop to add pages</div>
  </div>
  <footer class="hint">
    <span>Drag pages to reorder</span>
    <span>Click to select, <kbd>Shift</kbd>+click for a range</span>
    <span><kbd>Alt</kbd>+<kbd>←</kbd><kbd>→</kbd> moves a page</span>
    <span><kbd>R</kbd> rotate</span><span><kbd>D</kbd> duplicate</span><span><kbd>Del</kbd> delete</span>
  </footer>
</section>

<section class="view" id="v-editor">
  <div class="ed-bar" id="edBar" role="toolbar" aria-label="Editor tools"></div>
  <div class="ed-pages" id="edPages"></div>
  <div class="ed-tip" id="edTip"></div>
</section>

<input type="file" id="file" class="sr" multiple accept="application/pdf,.pdf,image/*" tabindex="-1" aria-hidden="true">
<input type="file" id="toolFile" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="imgFile" class="sr" accept="image/*" tabindex="-1" aria-hidden="true">
<div class="marker" id="marker"></div>
<div class="menu" id="insMenu" role="menu">
  <button id="insFiles" role="menuitem"></button>
  <button id="insBlank" role="menuitem"></button>
</div>

<div class="veil" id="exportVeil">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h2 id="exTitle">Finish and download</h2>
    <label class="f" for="fname">File name <input type="text" id="fname" autocomplete="off" spellcheck="false"></label>
    <div class="radio" id="scope">
      <label for="scopeAll"><input type="radio" name="scope" id="scopeAll" value="all" checked> <span id="scopeAllText"></span></label>
      <label for="scopeSel"><input type="radio" name="scope" id="scopeSel" value="sel"> <span id="scopeSelText"></span></label>
    </div>
    <p class="note" id="exNote" role="status"></p>
    <div class="row">
      <button class="btn" id="exCancel">Keep editing</button>
      <button class="btn primary" id="exGo"></button>
    </div>
  </div>
</div>

<div class="veil" id="pvVeil">
  <div class="pv" role="dialog" aria-modal="true" aria-label="Page preview">
    <div class="pv-head">
      <span class="t" id="pvTitle"></span>
      <button class="btn icon" id="pvPrev" aria-label="Previous page"></button>
      <button class="btn icon" id="pvNext" aria-label="Next page"></button>
      <button class="btn icon" id="pvRot" aria-label="Rotate right"></button>
      <button class="btn icon" id="pvClose" aria-label="Close preview"></button>
    </div>
    <div class="pv-stage" id="pvStage"></div>
  </div>
</div>

<div class="veil" id="sigVeil">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
    <h2 id="sigTitle">Create your signature</h2>
    <div class="tabs" id="sigTabs"></div>
    <div id="sigBody"></div>
    <p class="note" id="sigNote">Your signature stays in this browser.</p>
    <div class="row">
      <button class="btn" id="sigCancel">Cancel</button>
      <button class="btn primary" id="sigUse">Use this signature</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="./vendor/pdf-lib.min.js"></script>
<script src="./vendor/jszip.min.js"></script>
<script type="module">
/*__SCRIPT__*/
</script>
</body>
</html>
